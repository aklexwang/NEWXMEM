# GitHub Pages 자동 배포
# main 브랜치에 푸시할 때마다 빌드 후 Pages에 배포됩니다.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # 로컬 `npm run dev` → http://localhost:5173/NEWXMEM/ 과 동일 base(`/NEWXMEM/`)로 빌드
      - name: Build (same as local: npm run build)
        run: npm run build
      - name: Verify dist has /NEWXMEM/ (match localhost:5173/NEWXMEM/)
        run: node ./scripts/verify-base.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
