<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>접근 승인 관리</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #020617;
      color: #e2e8f0;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .hint {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn:hover { background: #1e293b; }

    /* 카드 + 표 (흰색 샘플과 동일한 구성, 색은 다크 유지) */
    .panel {
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.6);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.45);
    }
    .panel-ico {
      font-size: 20px;
      line-height: 1;
      user-select: none;
    }
    .panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      text-align: left;
      padding: 12px 16px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }
    .data-table td {
      padding: 14px 16px;
      vertical-align: middle;
      border-bottom: 1px solid #1e293b;
      color: #e2e8f0;
    }
    .data-table tbody tr:hover td {
      background: rgba(30, 41, 59, 0.25);
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .cell-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
    }
    .cell-url {
      color: #94a3b8;
      max-width: 220px;
      word-break: break-all;
    }
    .cell-tg {
      color: #7dd3fc;
      max-width: 160px;
      word-break: break-all;
    }
    .date-cell {
      color: #cbd5e1;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .b-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }
    .b-approved {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .b-rejected {
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
    }
    .b-ok {
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }
    .b-bad {
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
    }
    .b-muted {
      color: #64748b;
      background: rgba(100, 116, 139, 0.15);
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }
    .approve {
      border: 1px solid #059669;
      background: #065f46;
      color: #ecfdf5;
    }
    .approve:hover { background: #047857; }
    .reject {
      border: 1px solid #be123c;
      background: #881337;
      color: #fff1f2;
    }
    .reject:hover { background: #9f1239; }
    .empty {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      padding: 48px 20px;
    }
    .login-backdrop {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.95);
      padding: 28px 24px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .login-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .login-card p.sub {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 15px;
    }
    .field input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .login-btn {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #059669;
      background: #047857;
      color: #ecfdf5;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { background: #059669; }
    .login-err {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      font-size: 13px;
    }
    .login-err.show { display: block; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-backdrop" hidden>
    <div class="login-card">
      <h2>관리자 로그인</h2>
      <p class="sub">접근 승인 관리 — 허용된 계정만 입장</p>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="admId">아이디</label>
          <input id="admId" name="username" type="text" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="admPw">비밀번호</label>
          <input id="admPw" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div class="login-err" id="loginErr" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <button type="submit" class="login-btn">로그인</button>
      </form>
    </div>
  </div>

  <div class="wrap" id="adminApp" hidden>
    <div class="top">
      <div>
        <h1>접근 승인 관리</h1>
        <p class="hint">체험 접근 요청을 확인하고 승인/거부를 처리합니다.</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
        <button class="btn" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <script>
    (function () {
      const AUTH_OK = "axpay_admin_ok_v1";
      const ADM_ID = "axpay";
      const ADM_PW = "eoqkrskwk";
      const STORAGE_KEY = "axpay-access-requests";
      const loginScreen = document.getElementById("loginScreen");
      const adminApp = document.getElementById("adminApp");
      const loginForm = document.getElementById("loginForm");
      const loginErr = document.getElementById("loginErr");
      const admId = document.getElementById("admId");
      const admPw = document.getElementById("admPw");
      const logoutBtn = document.getElementById("logoutBtn");
      const listEl = document.getElementById("list");
      const refreshBtn = document.getElementById("refreshBtn");

      function isAuthed() {
        try {
          return sessionStorage.getItem(AUTH_OK) === "1";
        } catch {
          return false;
        }
      }

      function setAuthed() {
        try {
          sessionStorage.setItem(AUTH_OK, "1");
        } catch {
          void 0;
        }
      }

      function clearAuth() {
        try {
          sessionStorage.removeItem(AUTH_OK);
        } catch {
          void 0;
        }
      }

      function showMain() {
        loginScreen.setAttribute("hidden", "");
        adminApp.removeAttribute("hidden");
      }

      function showLogin() {
        clearAuth();
        adminApp.setAttribute("hidden", "");
        loginScreen.removeAttribute("hidden");
        loginErr.classList.remove("show");
        if (admPw) admPw.value = "";
        if (admId) admId.value = "";
      }

      function readRequests() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch {
          return [];
        }
      }

      function saveRequests(next) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      }

      /** YYYY-MM-DD HH:mm (24시간) */
      function fmtDateTime24(ts) {
        try {
          const d = new Date(ts);
          if (Number.isNaN(d.getTime())) return "—";
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const h = String(d.getHours()).padStart(2, "0");
          const min = String(d.getMinutes()).padStart(2, "0");
          return `${y}-${m}-${day} ${h}:${min}`;
        } catch {
          return "—";
        }
      }

      function shortId(id) {
        if (!id) return "—";
        const s = String(id);
        return s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-5) : s;
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value ?? "");
        return div.innerHTML;
      }

      function render() {
        const requests = readRequests();
        if (requests.length === 0) {
          listEl.innerHTML = '<div class="panel"><div class="empty">요청 내역이 없습니다.</div></div>';
          return;
        }

        const rows = requests
          .map((req) => {
            const stateClass =
              req.status === "approved" ? "b-approved" : req.status === "rejected" ? "b-rejected" : "b-pending";
            const statusLabel =
              req.status === "approved" ? "승인" : req.status === "rejected" ? "거절" : "대기";
            const accessClass =
              req.status === "approved" ? "b-ok" : req.status === "rejected" ? "b-bad" : "b-muted";
            const accessLabel = req.status === "approved" ? "정상" : req.status === "rejected" ? "불가" : "—";
            const tg = (req.telegramId && String(req.telegramId).trim()) || "";

            const idAttr = encodeURIComponent(String(req.id));
            const actionCell =
              req.status === "pending"
                ? `<div class="actions" data-req-id="${idAttr}">
                    <button type="button" class="btn btn-sm approve" data-approve>승인</button>
                    <button type="button" class="btn btn-sm reject" data-reject>거부</button>
                  </div>`
                : `<span class="b-muted" style="padding:4px 8px; border-radius:6px; font-size:12px; color:#64748b">처리됨</span>`;

            return `<tr>
              <td class="cell-mono">${escapeHtml(shortId(req.id))}</td>
              <td>${escapeHtml(req.siteName || "—")}</td>
              <td class="cell-url">${escapeHtml(req.siteUrl || "—")}</td>
              <td class="cell-tg">${tg ? escapeHtml(tg) : "—"}</td>
              <td class="date-cell">${escapeHtml(fmtDateTime24(req.createdAt))}</td>
              <td><span class="badge ${stateClass}">${statusLabel}</span></td>
              <td><span class="badge ${accessClass}">${accessLabel}</span></td>
              <td class="td-actions">${actionCell}</td>
            </tr>`;
          })
          .join("");

        listEl.innerHTML = `
          <div class="panel">
            <div class="panel-head">
              <span class="panel-ico" title="">👤</span>
              <h2 class="panel-title">접근 요청 목록</h2>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>요청 ID</th>
                    <th>사이트 이름</th>
                    <th>사이트 주소</th>
                    <th>텔레그램</th>
                    <th>신청 일시</th>
                    <th>승인 상태</th>
                    <th>접근</th>
                    <th>처리</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;

        listEl.querySelectorAll("[data-req-id]").forEach((wrap) => {
          const enc = wrap.getAttribute("data-req-id");
          if (!enc) return;
          let id;
          try {
            id = decodeURIComponent(enc);
          } catch {
            id = enc;
          }
          wrap.querySelector("[data-approve]")?.addEventListener("click", () => {
            const next = readRequests().map((x) => (String(x.id) === id ? { ...x, status: "approved" } : x));
            saveRequests(next);
            render();
          });
          wrap.querySelector("[data-reject]")?.addEventListener("click", () => {
            const next = readRequests().map((x) => (String(x.id) === id ? { ...x, status: "rejected" } : x));
            saveRequests(next);
            render();
          });
        });
      }

      if (loginForm) {
        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const id = (admId && admId.value.trim()) || "";
          const pw = (admPw && admPw.value) || "";
          if (id === ADM_ID && pw === ADM_PW) {
            setAuthed();
            showMain();
            render();
          } else {
            loginErr.classList.add("show");
          }
        });
      }
      if (logoutBtn) {
        logoutBtn.addEventListener("click", function () {
          showLogin();
        });
      }
      if (refreshBtn) {
        refreshBtn.addEventListener("click", function () {
          if (isAuthed()) render();
        });
      }
      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEY && isAuthed()) render();
      });

      if (isAuthed()) {
        showMain();
        render();
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
