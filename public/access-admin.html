<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>접근 승인 관리</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #020617;
      color: #e2e8f0;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .hint {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn:hover { background: #1e293b; }

    /* 카드 + 표 (흰색 샘플과 동일한 구성, 색은 다크 유지) */
    .panel {
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.6);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.45);
    }
    .panel-ico {
      font-size: 20px;
      line-height: 1;
      user-select: none;
    }
    .panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      text-align: left;
      padding: 12px 16px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }
    .data-table td {
      padding: 14px 16px;
      vertical-align: middle;
      border-bottom: 1px solid #1e293b;
      color: #e2e8f0;
    }
    .data-table tbody tr:hover td {
      background: rgba(30, 41, 59, 0.25);
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .cell-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
    }
    .cell-url {
      color: #94a3b8;
      max-width: 220px;
      word-break: break-all;
    }
    .cell-tg {
      color: #7dd3fc;
      max-width: 160px;
      word-break: break-all;
    }
    .date-cell {
      color: #cbd5e1;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .b-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }
    .b-approved {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .b-rejected {
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
    }
    .b-ok {
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }
    .b-bad {
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
    }
    .b-muted {
      color: #64748b;
      background: rgba(100, 116, 139, 0.15);
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }
    .approve {
      border: 1px solid #059669;
      background: #065f46;
      color: #ecfdf5;
    }
    .approve:hover { background: #047857; }
    .reject {
      border: 1px solid #be123c;
      background: #881337;
      color: #fff1f2;
    }
    .reject:hover { background: #9f1239; }
    .empty {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      padding: 48px 20px;
    }
    .login-backdrop {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.95);
      padding: 28px 24px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .login-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .login-card p.sub {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 15px;
    }
    .field input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .login-btn {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #059669;
      background: #047857;
      color: #ecfdf5;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { background: #059669; }
    .login-err {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      font-size: 13px;
    }
    .login-err.show { display: block; }

    /* 비번 보기 토글 + Caps Lock 경고 */
    .pw-wrap { position: relative; }
    .pw-eye {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .pw-eye:hover { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
    .caps-warn {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      font-size: 12px;
    }
    .caps-warn.show { display: block; }

    /* === 신규: 알림(토스트/뱃지/하이라이트/알림버튼) === */
    .toast-stack {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }
    .toast {
      min-width: 280px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(56, 189, 248, 0.16));
      border: 1px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.22), 0 2px 8px rgba(0, 0, 0, 0.45);
      color: #ecfdf5;
      font-size: 13px;
      line-height: 1.45;
      pointer-events: auto;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast .toast-title {
      font-weight: 700;
      color: #6ee7b7;
      margin-bottom: 4px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toast .toast-body { color: #d1fae5; font-size: 12px; word-break: break-all; }
    .toast .toast-body .ln { display: block; }
    .toast .toast-body .ln + .ln { margin-top: 2px; opacity: 0.85; }

    /* 처리 대기(pending) 행은 승인/거부 누를 때까지 호박색으로 계속 펄스 */
    .row-new td {
      animation: rowAttentionPulse 1.2s ease-in-out infinite;
      position: relative;
    }
    .row-new td:first-child {
      box-shadow: inset 4px 0 0 0 rgba(251, 191, 36, 0.95);
    }
    @keyframes rowAttentionPulse {
      0%, 100% { background-color: rgba(245, 158, 11, 0.10); }
      50%      { background-color: rgba(245, 158, 11, 0.42); }
    }
    /* 대기 뱃지 자체도 살짝 호흡 */
    .row-new .badge.b-pending {
      animation: badgePulse 1.2s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.0); transform: scale(1); }
      50%      { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25); transform: scale(1.04); }
    }

    .btn-notif {
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-notif:hover { background: #1e293b; }
    .btn-notif.on {
      border-color: #059669;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.08);
    }
    .btn-notif:disabled { opacity: 0.5; cursor: not-allowed; }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.18);
      color: #fcd34d;
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }
    .pending-badge.zero { display: none; }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
      animation: pulseDot 1.6s infinite;
    }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }
  </style>
</head>
<body>
  <div class="wrap" id="adminApp">
    <div class="top">
      <div>
        <h1>
          접근 승인 관리
          <span id="pendingBadge" class="pending-badge zero" aria-live="polite">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span id="pendingCountText">0</span> 대기
          </span>
        </h1>
        <p class="hint">체험 접근 요청을 확인하고 승인/거부를 처리합니다.</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button class="btn-notif" id="notifBtn" type="button" title="새 요청이 오면 데스크톱 알림 표시">🔔 알림 켜기</button>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function () {
      const STORAGE_KEY = "axpay-access-requests";
      const listEl = document.getElementById("list");
      const refreshBtn = document.getElementById("refreshBtn");
      const notifBtn = document.getElementById("notifBtn");
      const toastStack = document.getElementById("toastStack");
      const pendingBadge = document.getElementById("pendingBadge");
      const pendingCountText = document.getElementById("pendingCountText");
      const BASE_TITLE = "접근 승인 관리";

      /** 이미 본 요청 ID — 새 요청만 알림 발사 */
      const seenIds = new Set();
      /** 첫 렌더(페이지 로드 직후) 는 무음 */
      let alertsArmed = false;
      /** 탭 제목 깜빡임 타이머 */
      let titleFlashTimer = null;
      /** 마지막으로 측정된 pending 개수 — visibilitychange 에서 사용 */
      let lastPendingCount = 0;
      /** 파비콘 상태 캐시 (동일 상태면 재생성 스킵) */
      let faviconAlertState = null;

      function readRequests() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch {
          return [];
        }
      }

      function saveRequests(next) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      }

      /** YYYY-MM-DD HH:mm (24시간) */
      function fmtDateTime24(ts) {
        try {
          const d = new Date(ts);
          if (Number.isNaN(d.getTime())) return "—";
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const h = String(d.getHours()).padStart(2, "0");
          const min = String(d.getMinutes()).padStart(2, "0");
          return `${y}-${m}-${day} ${h}:${min}`;
        } catch {
          return "—";
        }
      }

      function shortId(id) {
        if (!id) return "—";
        const s = String(id);
        return s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-5) : s;
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value ?? "");
        return div.innerHTML;
      }

      /** 4음 도어벨 (외부 파일 X · 사용자 제스처 후 안정 동작) */
      function playBeep() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = new Ctx();
          const tone = (freq, startOffset, dur, vol) => {
            const v = typeof vol === "number" ? vol : 0.24;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.value = freq;
            const t0 = ctx.currentTime + startOffset;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(v, t0 + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
          };
          // 도-미-솔-도(높은) 상승 도어벨
          tone(523, 0.00, 0.16);
          tone(659, 0.16, 0.16);
          tone(784, 0.32, 0.18);
          tone(1047, 0.50, 0.32, 0.30);
          setTimeout(() => { try { ctx.close(); } catch { void 0; } }, 1100);
        } catch {
          void 0;
        }
      }

      /** 캔버스로 파비콘 동적 생성 (빨간 점 = 미처리 알림) */
      function setFaviconAlert(hasAlert) {
        if (faviconAlertState === hasAlert) return;
        faviconAlertState = hasAlert;
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 32;
          canvas.height = 32;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;
          // 라운드 사각형 배경
          const r = 6;
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(32 - r, 0);
          ctx.quadraticCurveTo(32, 0, 32, r);
          ctx.lineTo(32, 32 - r);
          ctx.quadraticCurveTo(32, 32, 32 - r, 32);
          ctx.lineTo(r, 32);
          ctx.quadraticCurveTo(0, 32, 0, 32 - r);
          ctx.lineTo(0, r);
          ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.fill();
          // A 글자
          ctx.fillStyle = hasAlert ? "#fbbf24" : "#38bdf8";
          ctx.font = "bold 22px -apple-system, Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("A", 16, 17);
          // 빨간 알림 점
          if (hasAlert) {
            ctx.beginPath();
            ctx.arc(24, 8, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          let link = document.querySelector("link[rel~='icon']");
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.type = "image/png";
          link.href = canvas.toDataURL("image/png");
        } catch {
          void 0;
        }
      }

      /** 탭 제목 깜빡임 — 백그라운드 탭에서도 보이라고 */
      function startTitleFlash(count) {
        stopTitleFlash();
        let alt = false;
        const tick = () => {
          document.title = alt
            ? "🔔 새 요청 " + count + "건!"
            : "(" + count + ") " + BASE_TITLE;
          alt = !alt;
        };
        tick();
        titleFlashTimer = window.setInterval(tick, 900);
      }
      function stopTitleFlash() {
        if (titleFlashTimer != null) {
          clearInterval(titleFlashTimer);
          titleFlashTimer = null;
        }
      }
      function applyTitleStrategy(count) {
        if (count <= 0) {
          stopTitleFlash();
          document.title = BASE_TITLE;
          return;
        }
        if (document.hidden) {
          startTitleFlash(count);
        } else {
          stopTitleFlash();
          document.title = "(" + count + ") " + BASE_TITLE;
        }
      }
      document.addEventListener("visibilitychange", () => {
        applyTitleStrategy(lastPendingCount);
      });
      window.addEventListener("focus", () => {
        applyTitleStrategy(lastPendingCount);
      });

      /** 우측 상단 토스트 */
      function showToast(req) {
        if (!toastStack) return;
        const el = document.createElement("div");
        el.className = "toast";
        el.setAttribute("role", "status");
        el.innerHTML =
          '<div class="toast-title">🔔 새 체험 접근 요청</div>' +
          '<div class="toast-body">' +
          '<span class="ln"><strong>' + escapeHtml(req.siteName || "—") + "</strong></span>" +
          '<span class="ln">' + escapeHtml(req.siteUrl || "—") + "</span>" +
          (req.telegramId ? '<span class="ln">TG: ' + escapeHtml(req.telegramId) + "</span>" : "") +
          "</div>";
        toastStack.appendChild(el);
        requestAnimationFrame(() => el.classList.add("show"));
        const remove = () => {
          el.classList.remove("show");
          setTimeout(() => el.remove(), 400);
        };
        const t = setTimeout(remove, 6000);
        el.addEventListener("click", () => {
          clearTimeout(t);
          remove();
        });
      }

      /** OS 데스크톱 알림 (권한 받은 경우만, 직접 닫을 때까지 유지) */
      function fireDesktopNotification(req) {
        if (!("Notification" in window)) return;
        if (Notification.permission !== "granted") return;
        try {
          const n = new Notification("새 체험 접근 요청", {
            body: (req.siteName || "—") + "\n" + (req.siteUrl || "—"),
            tag: "axpay-access-" + req.id,
            renotify: true,
            requireInteraction: true,
          });
          n.onclick = () => {
            window.focus();
            n.close();
          };
        } catch {
          void 0;
        }
      }

      function refreshNotifBtn() {
        if (!notifBtn) return;
        if (!("Notification" in window)) {
          notifBtn.textContent = "🔕 알림 미지원";
          notifBtn.disabled = true;
          notifBtn.classList.remove("on");
          return;
        }
        if (Notification.permission === "granted") {
          notifBtn.textContent = "🔔 알림 켜짐";
          notifBtn.classList.add("on");
        } else if (Notification.permission === "denied") {
          notifBtn.textContent = "🔕 알림 차단됨";
          notifBtn.classList.remove("on");
        } else {
          notifBtn.textContent = "🔔 알림 켜기";
          notifBtn.classList.remove("on");
        }
      }

      function updateTitleAndBadge(pendingCount) {
        lastPendingCount = pendingCount;
        if (pendingCountText) pendingCountText.textContent = String(pendingCount);
        if (pendingBadge) pendingBadge.classList.toggle("zero", pendingCount === 0);
        applyTitleStrategy(pendingCount);
        setFaviconAlert(pendingCount > 0);
      }

      /** 신규 pending 만 골라서 토스트·비프·데스크톱 알림 */
      function detectAndAlert(requests) {
        const newPending = [];
        for (const r of requests) {
          if (r.status === "pending" && !seenIds.has(String(r.id))) {
            newPending.push(r);
          }
        }
        for (const r of requests) seenIds.add(String(r.id));

        const pendingCount = requests.filter((r) => r.status === "pending").length;
        updateTitleAndBadge(pendingCount);

        if (alertsArmed && newPending.length > 0) {
          newPending.forEach((req) => {
            showToast(req);
            fireDesktopNotification(req);
          });
          playBeep();
        }
        alertsArmed = true;
      }

      function render() {
        const requests = readRequests();
        detectAndAlert(requests);
        if (requests.length === 0) {
          listEl.innerHTML = '<div class="panel"><div class="empty">요청 내역이 없습니다.</div></div>';
          return;
        }

        const rows = requests
          .map((req) => {
            const stateClass =
              req.status === "approved" ? "b-approved" : req.status === "rejected" ? "b-rejected" : "b-pending";
            const statusLabel =
              req.status === "approved" ? "승인" : req.status === "rejected" ? "거절" : "대기";
            const accessClass =
              req.status === "approved" ? "b-ok" : req.status === "rejected" ? "b-bad" : "b-muted";
            const accessLabel = req.status === "approved" ? "정상" : req.status === "rejected" ? "불가" : "—";
            const tg = (req.telegramId && String(req.telegramId).trim()) || "";

            const idAttr = encodeURIComponent(String(req.id));
            const rowIdAttr = escapeHtml(String(req.id));
            const rowClass = req.status === "pending" ? "row-new" : "";
            const actionCell =
              req.status === "pending"
                ? `<div class="actions" data-req-id="${idAttr}">
                    <button type="button" class="btn btn-sm approve" data-approve>승인</button>
                    <button type="button" class="btn btn-sm reject" data-reject>거부</button>
                  </div>`
                : `<span class="b-muted" style="padding:4px 8px; border-radius:6px; font-size:12px; color:#64748b">처리됨</span>`;

            return `<tr${rowClass ? ` class="${rowClass}"` : ""} data-row-id="${rowIdAttr}">
              <td class="cell-mono">${escapeHtml(shortId(req.id))}</td>
              <td>${escapeHtml(req.siteName || "—")}</td>
              <td class="cell-url">${escapeHtml(req.siteUrl || "—")}</td>
              <td class="cell-tg">${tg ? escapeHtml(tg) : "—"}</td>
              <td class="date-cell">${escapeHtml(fmtDateTime24(req.createdAt))}</td>
              <td><span class="badge ${stateClass}">${statusLabel}</span></td>
              <td><span class="badge ${accessClass}">${accessLabel}</span></td>
              <td class="td-actions">${actionCell}</td>
            </tr>`;
          })
          .join("");

        listEl.innerHTML = `
          <div class="panel">
            <div class="panel-head">
              <span class="panel-ico" title="">👤</span>
              <h2 class="panel-title">접근 요청 목록</h2>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>요청 ID</th>
                    <th>사이트 이름</th>
                    <th>사이트 주소</th>
                    <th>텔레그램</th>
                    <th>신청 일시</th>
                    <th>승인 상태</th>
                    <th>접근</th>
                    <th>처리</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;

        listEl.querySelectorAll("[data-req-id]").forEach((wrap) => {
          const enc = wrap.getAttribute("data-req-id");
          if (!enc) return;
          let id;
          try {
            id = decodeURIComponent(enc);
          } catch {
            id = enc;
          }
          wrap.querySelector("[data-approve]")?.addEventListener("click", () => {
            const next = readRequests().map((x) => (String(x.id) === id ? { ...x, status: "approved" } : x));
            saveRequests(next);
            render();
          });
          wrap.querySelector("[data-reject]")?.addEventListener("click", () => {
            const next = readRequests().map((x) => (String(x.id) === id ? { ...x, status: "rejected" } : x));
            saveRequests(next);
            render();
          });
        });
      }

      if (refreshBtn) {
        refreshBtn.addEventListener("click", function () {
          render();
        });
      }
      if (notifBtn) {
        notifBtn.addEventListener("click", function () {
          if (!("Notification" in window)) {
            refreshNotifBtn();
            return;
          }
          if (Notification.permission === "default") {
            Notification.requestPermission().then(refreshNotifBtn);
          } else if (Notification.permission === "granted") {
            try {
              const n = new Notification("알림 테스트", {
                body: "새 체험 접근 요청이 오면 이렇게 알립니다.",
                tag: "axpay-access-test",
              });
              setTimeout(() => n.close(), 3000);
            } catch {
              void 0;
            }
            refreshNotifBtn();
          } else {
            refreshNotifBtn();
          }
        });
      }
      refreshNotifBtn();

      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEY) render();
      });

      render();
    })();
  </script>
</body>
</html>
